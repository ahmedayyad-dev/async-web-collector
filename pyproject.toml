[project]
name = "async-web-collector"
version = "0.1.0"
description = "Responsible asynchronous web data collection: robots.txt, per-host rate limiting, retries with backoff, CSS/XPath extraction, JSON/CSV export."
readme = "README.md"
authors = [{ name = "ahmedayyad", email = "ahmed@ahmedayyad.dev" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["scraping", "async", "httpx", "selectolax", "lxml", "xpath", "robots", "crawler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "lxml>=5.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
http2 = ["httpx[http2]>=0.28"]

[project.scripts]
async-web-collector = "async_web_collector.cli:app"

[project.urls]
Homepage = "https://github.com/ahmedayyad/async-web-collector"
Repository = "https://github.com/ahmedayyad/async-web-collector"
Issues = "https://github.com/ahmedayyad/async-web-collector/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["lxml.*", "selectolax.*"]
ignore_missing_imports = true
